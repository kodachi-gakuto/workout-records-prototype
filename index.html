<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>筋トレ記録（試作）</title>
  <!-- ホーム画面に追加して開く形（standalone） -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="筋トレ記録">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <!-- キーボードの上のバー（入力欄にフォーカスしている間だけ出す） -->
  <div id="kbar" class="kbar" hidden>
    <div class="kseg" id="kseg" role="group" aria-label="入力の種類"></div>
    <div class="right">
      <button type="button" class="tbtn" id="kbar-timer" aria-label="休憩タイマー">⏱ <span id="kbar-time">2:00</span></button>
      <button type="button" class="fin" id="kbar-done">完了</button>
    </div>
  </div>
  <div id="toast-top" class="toast top" role="status" hidden></div>
  <div id="toast-bottom" class="toast bottom" role="status" hidden>
    <span id="undo-text"></span>
    <button type="button" id="undo-btn">元に戻す</button>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
